name: eduquest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- DATABASE (FULL OFFLINE & AUTO-SAVE) ---
  isar: ^3.1.0+1              # The high-speed NoSQL database
  isar_flutter_libs: ^3.1.0+1 # Required binaries for Android/iOS
  path_provider: ^2.1.2       # Finds the correct storage path on the phone
  shared_preferences: ^2.3.5 # Adds local storage preferences tracking
  flutter_phoenix: ^1.1.1 # APPLIED: Allows our code to force an absolute native hardware app restart

  # --- OFFLINE AI & UTILS ---
  flutter_gemma: ^0.15.1      # On-device LLM generation engine for local execution
  google_ml_kit: ^0.16.0      # Umbrella framework for general machine learning tasks
  google_mlkit_text_recognition: ^0.11.0 # High-speed local OCR for screenshots/images
  syncfusion_flutter_pdf: ^24.2.7 # Completely offline textual extraction for document streams
  file_picker: ^8.0.0          # Multi-format native mobile explorer system bridge
  connectivity_plus: ^5.0.2   # Detects internet for eventual background data management
  audioplayers: ^6.6.0
  permission_handler: ^11.3.0 # Handles native OS storage and alert capabilities requests

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^5.13.0

  # --- CODE GENERATORS (FOR DATABASE) ---
  isar_generator: ^3.1.0+1    # Generates the 'player.g.dart' file
  build_runner: ^2.4.8        # The tool that runs the generators

# 1. APP ICON CONFIGURATION
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" 
  min_sdk_android: 21
  adaptive_icon_background: "#5E3A85" 
  adaptive_icon_foreground: "assets/logo.png" 

# 2. NATIVE SPLASH SCREEN CONFIGURATION
flutter_native_splash:
  color: "#1A0B2E" 
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#1A0B2E"

flutter:
  uses-material-design: true

  # --- ASSET REGISTRY ---
  assets:
    - assets/background.png    
    - assets/logo.png          
